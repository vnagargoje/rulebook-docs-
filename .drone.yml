kind: pipeline
type: digitalocean
name: yugo-deploy

token:
  from_secret: DO_TOKEN

server:
  image: docker-20-04
  size: s-2vcpu-4gb
  region: nyc1

steps:
  - name: docker-build-api
    image: plugins/docker
    settings:
      registry: registry.digitalocean.com
      username:
        from_secret: DOCR_TOKEN
      password:
        from_secret: DOCR_TOKEN
      repo: registry.digitalocean.com/yugo-builds/api
      dockerfile: Dockerfile.api
      context: .
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}

  - name: docker-build-henchman
    image: plugins/docker
    settings:
      registry: registry.digitalocean.com
      username:
        from_secret: DOCR_TOKEN
      password:
        from_secret: DOCR_TOKEN
      repo: registry.digitalocean.com/yugo-builds/henchman
      dockerfile: Dockerfile.henchmen
      context: .
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}

  - name: docker-build-backoffice
    image: plugins/docker
    settings:
      registry: registry.digitalocean.com
      username:
        from_secret: DOCR_TOKEN
      password:
        from_secret: DOCR_TOKEN
      repo: registry.digitalocean.com/yugo-builds/backoffice
      dockerfile: apps/backoffice/Dockerfile
      context: .
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}

  - name: deploy-to-droplet
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: DROPLET_HOST
      username: officebot
      key:
        from_secret: SSH_PRIVATE_KEY
      script:
        - cd ~/yugo
        - echo "$DOCR_TOKEN" | docker login registry.digitalocean.com -u $DOCR_TOKEN --password-stdin
        - docker compose pull
        - docker compose up -d --remove-orphans
        - docker image prune -f
    environment:
      DOCR_TOKEN:
        from_secret: DOCR_TOKEN
    depends_on:
      - docker-build-api
      - docker-build-henchman
      - docker-build-backoffice

trigger:
  event:
    - push
  branch:
    - dev
