services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: yugo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "123456"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    image: yugo/api:local
    ports:
      - "4500:4500"
    env_file: ../apps/api/.env.example
    environment:
      DATABASE_MASTER_URL: mysql://root:123456@mysql:3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 123456
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  henchmen:
    build:
      context: ..
      dockerfile: Dockerfile.henchmen
    image: yugo/henchmen:local
    ports:
      - "4502:4502"
    env_file: ../apps/henchmen/.env.example
    environment:
      DATABASE_MASTER_URL: mysql://root:123456@mysql:3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 123456
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  backoffice:
    build:
      context: ..
      dockerfile: apps/backoffice/Dockerfile
    image: yugo/backoffice:local
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  redis_data:
