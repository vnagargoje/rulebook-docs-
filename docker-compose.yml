networks:
  yugo_net:
    driver: bridge

volumes:
  traefik_certs:

services:
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/officebot/.docker/config.json:/config.json
    environment:
      WATCHTOWER_MONITOR_ONLY: "true"
      WATCHTOWER_NOTIFICATIONS: slack
      WATCHTOWER_NOTIFICATION_SLACK_HOOK_URL: ${SLACK_WEBHOOK_URL}
      WATCHTOWER_POLL_INTERVAL: 300
    networks:
      - yugo_net

  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: always
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    command:
      - --log.level=DEBUG
      - --accesslog
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.forwardedHeaders.insecure
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=tech@foamingo.com
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.foamingo.com`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls=true
      - traefik.http.routers.traefik.tls.certresolver=le
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=traefik-auth
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_AUTH_USER:-admin}:${TRAEFIK_AUTH_HASH}
    networks:
      - yugo_net

  api:
    image: registry.digitalocean.com/yugo-builds/api:${API_TAG:-latest}
    container_name: api
    restart: always
    env_file: envs/.env.api
    networks:
      - yugo_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.foamingo.com`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=4500

  henchman:
    image: registry.digitalocean.com/yugo-builds/henchman:${HENCHMAN_TAG:-latest}
    container_name: henchman
    restart: always
    env_file: envs/.env.henchman
    networks:
      - yugo_net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  backoffice:
    image: registry.digitalocean.com/yugo-builds/backoffice:${BACKOFFICE_TAG:-latest}
    container_name: backoffice
    restart: always
    env_file: envs/.env.backoffice
    networks:
      - yugo_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.backoffice.rule=Host(`admin.foamingo.com`)
      - traefik.http.routers.backoffice.entrypoints=websecure
      - traefik.http.routers.backoffice.tls=true
      - traefik.http.routers.backoffice.tls.certresolver=le
      - traefik.http.services.backoffice.loadbalancer.server.port=3000
